server:
  port: 3000

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/umc_movie?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true